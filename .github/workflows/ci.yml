name: CI

# Tests and builds every push, so a broken change is caught before it reaches the server.
# The site itself runs on our own Windows Server (docs/deploy-windows-server.md).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the website
        run: npm run build

      - name: Build the server
        run: npm run build:server
