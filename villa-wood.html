<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="only light" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="كتالوج تفصيلي لفيلا الخشب من النظرة الساحرة: المساحات والقطع والخامات." />
    <meta name="theme-color" content="#253A35" />
    <title>فيلا الخشب | النظرة الساحرة</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preload" as="image" href="./images/villa/living-wide-b.webp" fetchpriority="high" />
  </head>
  <body class="villa-body">
    <!--site:header-->
    <header class="vbar is-solid" id="vbar">
      <a class="vbar-back" href="./projects.html">كل المشاريع</a>
      <p class="vbar-title"><span>فيلا الخشب</span><span class="latin">Catalogue</span></p>
      <div class="vbar-end">
        <span class="vbar-now" id="vbar-now" aria-live="polite"></span>
        <button class="vbar-index" id="vbar-index" type="button" aria-haspopup="dialog">الفهرس</button>
      </div>
      <i class="vbar-progress" aria-hidden="true"></i>
    </header>
    <main id="main">
      <section class="vcover" id="cover" data-title="الغلاف" aria-labelledby="cover-title">
        <img class="vcover-img" src="./images/villa/living-wide-b.webp" alt="الصالة العائلية في فيلا الخشب: جدار من البلوط وثريا من الجوت فوق الجلسة" fetchpriority="high" />
        <div class="vcover-shade" aria-hidden="true"></div>
        <p class="vcover-edition latin">Interior catalogue · MMXXVI</p>
        <div class="vcover-copy">
          <p class="vcover-kicker">كتالوج التصميم الداخلي والأثاث</p>
          <h1 class="vcover-title" id="cover-title">فيلا الخشب</h1>
          <p class="vcover-en latin">The Wood Villa</p>
          <p class="vcover-tag">بلوط دافئ، وترافرتين هادئ، وكتان يتنفّس ضوء النهار.</p>
        </div>
        <ul class="vcover-facts" id="cover-facts" aria-label="الكتالوج في أرقام"></ul>
        <a class="vcover-start" href="#intro">ابدأ التصفّح</a>
      </section>
      <div id="villa-content" aria-busy="true"><div class="boot" aria-label="جارٍ التحميل"></div></div>
    </main>
    <!--site:footer-->
    <script type="module" src="/src/villa.ts"></script>
