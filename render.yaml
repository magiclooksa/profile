# One-click hosting on Render (render.com → New → Blueprint → pick this repository).
# It builds the site and runs the server, which hosts both the site and the API.
services:
  - type: web
    name: magiclook
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: magiclook
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Render's free disk is wiped on every restart, so files are kept inside MongoDB there.
      - key: STORAGE_DRIVER
        value: gridfs
      - key: CORS_ORIGINS
        value: https://magiclooksa.github.io
